<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Landing Page</title>
</head>
<body>
    <!-- Hero Section -->
    <section class="relative pt-32 pb-20 md:pt-40 md:pb-32 hero-gradient overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                <div class="lg:col-span-6 space-y-6 text-center lg:text-left">
                    <span class="inline-flex items-center px-3 py-1 text-xs font-semibold text-brand-700 bg-brand-100 rounded-full">
                        ✨ Introducing Smartwatch v2.0
                    </span>
                    <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-slate-900 leading-tight">
                        Elevate Your Fitness & Daily Life
                    </h1>
                    <p class="text-lg sm:text-xl text-slate-600 max-w-xl mx-auto lg:mx-0">
                        Experience precision health tracking, unrivaled 7-day battery life, and a stunning AMOLED display designed for the modern achiever.
                    </p>
                    <div class="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4 pt-4">
                        <a href="#pricing" class="w-full sm:w-auto px-8 py-4 text-base font-semibold text-white bg-brand-600 rounded-xl hover:bg-brand-700 transition-all shadow-lg shadow-brand-600/25 text-center">
                            Buy Now - $199
                        </a>
                        <a href="#features" class="w-full sm:w-auto px-8 py-4 text-base font-semibold text-slate-700 bg-white border border-slate-300 rounded-xl hover:bg-slate-50 transition-all text-center">
                            Learn More
                        </a>
                    </div>
                </div>
                <!-- Product Image / Banner -->
                <div class="lg:col-span-6 flex justify-center">
                    <div class="relative w-full max-w-md aspect-square bg-gradient-to-tr from-brand-500 to-indigo-400 rounded-3xl shadow-2xl p-2 flex items-center justify-center overflow-hidden group">
                        <div class="absolute inset-0 bg-slate-900/10 backdrop-blur-[2px]"></div>
                        <!-- Placeholder Graphic for Product -->
                        <div class="relative bg-white/90 backdrop-blur rounded-2xl w-full h-full flex flex-col items-center justify-center p-8 text-center shadow-inner">
                            <img src="smart.jpg.jpg" class="text-7xl mb-4 group-hover:scale-110 transition-transform duration-300" width="220" height="50">
                            <h3 class="text-xl font-bold text-slate-800">Smartwatch</h3>
                            <p class="text-sm text-slate-500 mt-1">Metal Finish • Always-On Display</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
